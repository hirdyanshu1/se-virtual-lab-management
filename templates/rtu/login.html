{% extends "base.html" %}

{% block title %}Student Sign In | RTU Virtual Lab{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-10 col-lg-8">
        <div class="text-center mb-4">
            <span class="badge bg-primary fs-5 p-2 rounded-3 mb-2"><i class="fa-solid fa-graduation-cap"></i></span>
            <h4 class="fw-bold text-dark mb-1">RTU Virtual Lab</h4>
            <p class="text-muted small">Sign in or create a student account to save private practical work.</p>
        </div>

        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card shadow-sm border-rtu bg-white p-4 h-100">
                    <h5 class="fw-bold mb-3">Sign in</h5>
                    <form action="{{ url_for('student_login') }}" method="POST">
                        <input type="hidden" name="action" value="login">
                        <div class="mb-3">
                            <label class="form-label small fw-bold" for="login-username">Username</label>
                            <input id="login-username" type="text" name="username" class="form-control" autocomplete="username" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold" for="login-password">Password</label>
                            <input id="login-password" type="password" name="password" class="form-control" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary fw-bold w-100">
                            <i class="fa-solid fa-right-to-bracket me-1"></i> Sign in
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm border-rtu bg-white p-4 h-100">
                    <h5 class="fw-bold mb-3">Create student account</h5>
                    <form action="{{ url_for('student_login') }}" method="POST">
                        <input type="hidden" name="action" value="register">
                        <div class="mb-3">
                            <label class="form-label small fw-bold" for="register-name">Full name</label>
                            <input id="register-name" type="text" name="name" class="form-control" autocomplete="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold" for="register-roll">University roll number</label>
                            <input id="register-roll" type="text" name="roll_no" class="form-control font-monospace" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold" for="register-username">Username</label>
                            <input id="register-username" type="text" name="username" class="form-control" autocomplete="username" minlength="3" maxlength="32" pattern="[a-zA-Z0-9._\-]+" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold" for="register-password">Password (at least 8 characters)</label>
                            <input id="register-password" type="password" name="password" class="form-control" autocomplete="new-password" minlength="8" required>
                        </div>
                        <button type="submit" class="btn btn-outline-primary fw-bold w-100">
                            <i class="fa-solid fa-user-plus me-1"></i> Create account
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
